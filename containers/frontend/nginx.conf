server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve "backend" through Docker's DNS on each request instead of once at startup,
    # so rebuilding the backend (new container IP) doesn't leave nginx pointing at the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Same-origin API, like the Vite dev proxy. Uploads and slow local models need long limits.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100m;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
