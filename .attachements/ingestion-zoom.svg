<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90d9"/>
    </marker>
  </defs>

  <rect width="1680" height="800" fill="#ffffff"/>

  <rect x="48" y="240" width="330" height="120" rx="14" fill="#e8f7ef" stroke="#43a677"/>
  <text x="68" y="274" font-size="15" font-weight="700" fill="#1c6b4a">Build-time corpus</text>
  <text x="68" y="300" font-size="12" fill="#4f8d72">guides in data/styles/</text>
  <text x="68" y="322" font-size="12" fill="#4f8d72">CLI: generate_chroma.py</text>
  <text x="68" y="344" font-size="12" fill="#4f8d72">run once per data change</text>

  <rect x="48" y="385" width="330" height="145" rx="14" fill="#e9f2fc" stroke="#4a90d9"/>
  <text x="68" y="419" font-size="15" font-weight="700" fill="#1d5d9b">Runtime user files</text>
  <text x="68" y="445" font-size="12" fill="#5b87b0">PDF/DOCX/MD from the UI or sidebar</text>
  <text x="68" y="467" font-size="12" fill="#5b87b0">POST /api/documents</text>
  <text x="68" y="489" font-size="12" fill="#5b87b0">kind = userdocs | outline</text>
  <text x="68" y="511" font-size="12" fill="#5b87b0">re-upload replaces the old version</text>

  <path d="M 378 300 H 408 V 375 H 432" fill="none" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <path d="M 378 457 H 408 V 375 H 432" fill="none" stroke="#8a94a6" stroke-width="2"/>

  <rect x="440" y="315" width="200" height="120" rx="14" fill="#e9f2fc" stroke="#4a90d9"/>
  <text x="460" y="351" font-size="15" font-weight="700" fill="#1d5d9b">MarkItDown</text>
  <text x="460" y="377" font-size="12" fill="#5b87b0">PDF/DOCX → Markdown</text>
  <text x="460" y="399" font-size="12" fill="#5b87b0">headings, lists, tables kept</text>

  <rect x="680" y="315" width="200" height="120" rx="14" fill="#e9f2fc" stroke="#4a90d9"/>
  <text x="700" y="351" font-size="15" font-weight="700" fill="#1d5d9b">Text splitter</text>
  <text x="700" y="377" font-size="12" fill="#5b87b0">recursive character split</text>
  <text x="700" y="399" font-size="12" fill="#5b87b0">1000 chars · 400 overlap</text>

  <rect x="920" y="315" width="200" height="120" rx="14" fill="#e9f2fc" stroke="#4a90d9"/>
  <text x="940" y="351" font-size="15" font-weight="700" fill="#1d5d9b">Chunk IDs &amp; dedupe</text>
  <text x="940" y="377" font-size="12" fill="#5b87b0">source : page : index</text>
  <text x="940" y="399" font-size="12" fill="#5b87b0">re-runs skip old chunks</text>

  <rect x="1160" y="315" width="200" height="120" rx="14" fill="#fdf2df" stroke="#dfa45a"/>
  <text x="1180" y="351" font-size="15" font-weight="700" fill="#8a5a1e">nomic-embed-text</text>
  <text x="1180" y="377" font-size="12" fill="#a97f4a">local embeddings (Ollama)</text>
  <text x="1180" y="399" font-size="12" fill="#a97f4a">one vector per chunk</text>

  <rect x="1400" y="315" width="230" height="120" rx="14" fill="#ece9fa" stroke="#8f83d8"/>
  <text x="1420" y="351" font-size="15" font-weight="700" fill="#4a3f8f">ChromaDB</text>
  <text x="1420" y="373" font-size="12" fill="#7a70b5">collection by entry:</text>
  <text x="1420" y="393" font-size="12" fill="#7a70b5">corpus → formal · fiction</text>
  <text x="1420" y="413" font-size="12" fill="#7a70b5">uploads → userdocs · outline</text>

  <line x1="648" y1="375" x2="672" y2="375" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="888" y1="375" x2="912" y2="375" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="1128" y1="375" x2="1152" y2="375" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="1368" y1="375" x2="1392" y2="375" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="24" y="590" width="1632" height="170" rx="18" fill="#fbfbfd" stroke="#e3e8ee"/>
  <text x="48" y="622" font-size="12.5" font-weight="700" letter-spacing="2" fill="#64748b">WHAT THE AI TASKS READ</text>

  <rect x="48" y="638" width="504" height="98" rx="12" fill="#f3f1fc" stroke="#cfc8ee"/>
  <text x="68" y="674" font-size="14.5" font-weight="700" fill="#4a3f8f">grammar → style guides</text>
  <text x="68" y="702" font-size="12" fill="#7a70b5">'formal' or 'fiction' collection</text>

  <rect x="584" y="638" width="504" height="98" rx="12" fill="#f3f1fc" stroke="#cfc8ee"/>
  <text x="604" y="674" font-size="14.5" font-weight="700" fill="#4a3f8f">feedback → guides + outline</text>
  <text x="604" y="702" font-size="12" fill="#7a70b5">style collection + your plan</text>

  <rect x="1120" y="638" width="512" height="98" rx="12" fill="#f3f1fc" stroke="#cfc8ee"/>
  <text x="1140" y="674" font-size="14.5" font-weight="700" fill="#4a3f8f">QA → userdocs + outline</text>
  <text x="1140" y="702" font-size="12" fill="#7a70b5">your documents and plan,</text>
  <text x="1140" y="724" font-size="12" fill="#7a70b5">+ files attached to the chat</text>
</svg>
